name: Bug report
description: Report a reproducible Bruce Trigger problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Check the user guide and known limitations before reporting. Remove private information from screenshots and connection reports. For suspected vulnerabilities, follow SECURITY.md instead of posting sensitive details here.
  - type: input
    id: app
    attributes:
      label: App version and source
      description: Include the APK SHA-256 if available; identify custom builds.
      placeholder: "1.0.1, local test APK"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Exact LILYGO model and Bruce version
      placeholder: "T-Embed CC1101 Plus, Bruce 1.17"
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Active theme
      description: Specify default or the custom theme name.
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: USB setup
      description: Cable or adapter, OTG support, and whether Android granted USB access.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the starting screen, controls used, and whether a script was running. Use a harmless minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe any difference between the Android view and the physical screen.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or diagnostic report
      description: Optional. Review and redact private details before attaching or pasting content.
