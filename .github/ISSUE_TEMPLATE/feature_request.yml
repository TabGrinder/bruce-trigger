name: Feature request
description: Suggest a focused improvement to Bruce Trigger.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Describe the task you cannot complete with the current app.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected controls or result and any alternative you considered.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Hardware, firmware and references
      description: For compatibility requests, include exact versions and relevant upstream documentation. Do not assume a firmware feature can be mirrored.
